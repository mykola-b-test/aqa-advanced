name: Playwright Tests

on:
    push:
        branches:
            - '**'
    pull_request:
        types: [opened, synchronize]

jobs:
    playwright-run:
        name: Run Playwright tests in Docker via GitHub Actions
        runs-on: ubuntu-latest
        container:
            image: mcr.microsoft.com/playwright:v1.51.0-jammy

        defaults:
            run:
                working-directory: ./playwright-project

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Install dependencies
              run: npm ci

            - name: Install Playwright Browsers
              run: npx playwright install

            - name: Install Google Chrome
              run: npx playwright install chrome

            - name: Run Playwright tests
              run: npm run playwright:test:chrome:ci:qauto1

            - name: Upload Playwright & Test Results
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: playwright-test-results
                  path: |
                      playwright-project/playwright-report
                      playwright-project/test-results
                  if-no-files-found: ignore
                  retention-days: 3
