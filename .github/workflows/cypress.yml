name: Cypress Tests

on:
    push:
        branches:
            - '**'
    pull_request:
        types: [opened, synchronize]

jobs:
    cypress-run:
        name: Run Cypress tests in Docker via GitHub Actions
        runs-on: ubuntu-latest
        container:
            image: cypress/browsers:latest

        defaults:
            run:
                working-directory: ./cypress

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Install dependencies
              run: npm ci

            - name: Run Cypress e2e tests
              run: npm run cypress:run:chrome:env:qauto

            - name: Upload Cypress test screenshots & videos
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: cypress-test-results
                  path: |
                      cypress/cypress/reports/html
                  retention-days: 3
